{% extends 'base/base.html' %}
{% block extra_head %}
<style>
  /* Основной контейнер формы */
  .group-create-container {
    max-width: 480px;
    margin: 30px auto 60px auto;
    background-color: #121224;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow:
      0 0 14px #00ccffbb,
      inset 0 0 10px #00ccff44;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #a0eaff;
  }

  h2 {
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 30px;
    color: #00ccff;
    text-align: center;
    text-shadow: 0 0 10px #00ccffaa;
  }

  form label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #a0eaffcc;
    font-size: 1rem;
  }

  form input[type="text"],
  form textarea,
  form select {
    width: 100%;
    padding: 12px 15px;
    border-radius: 8px;
    border: 1.5px solid #00ccff44;
    background-color: #10172d;
    color: #a0eaff;
    font-size: 1rem;
    box-sizing: border-box;
    transition: border-color 0.3s ease, background-color 0.3s ease;
    resize: vertical;
    text-shadow: 0 0 6px #00ccff66;
  }

  form input[type="text"]:focus,
  form textarea:focus,
  form select:focus {
    outline: none;
    border-color: #00ccff;
    background-color: #162044;
  }

  /* Кнопка создания */
  button.btn-success {
    display: block;
    width: 100%;
    padding: 14px 0;
    font-weight: 700;
    font-size: 1.1rem;
    border-radius: 28px;
    border: none;
    cursor: pointer;
    color: #eefcff;
    background: linear-gradient(45deg, #7b3fbf, #4b1a8c);
    box-shadow: 0 0 14px #7b3fbfcc;
    transition: background 0.4s ease, box-shadow 0.3s ease, transform 0.2s ease;
    user-select: none;
    text-shadow: 0 0 6px #6f40b8;
  }

  button.btn-success:hover {
    background: linear-gradient(45deg, #9c55e0, #5e2ab3);
    box-shadow: 0 0 28px #a57fff;
    transform: translateY(-3px) scale(1.05);
    color: #fff;
  }
</style>
{% endblock %}

{% block content %}
<div class="group-create-container">
  <h2>Створити нову групу</h2>

  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-success">Створити</button>
  </form>
</div>
{% endblock %}
