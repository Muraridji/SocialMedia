{% extends 'base/base.html' %}
{% block content %}
<style>
  body {
    background-color: #121224;
    color: #a0eaff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  h1 {
    color: #00ccff;
    text-shadow: 0 0 8px #00ccff;
    margin-bottom: 20px;
  }

  form {
    max-width: 600px;
    margin: auto;
    background-color: #1a1f40;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 15px #00ccff;
  }

  form p {
    margin-bottom: 15px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #00ccff;
    text-shadow: 0 0 6px #00ccff;
  }

  input[type="text"],
  textarea,
  input[type="file"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #00ccff;
    background-color: #12172e;
    color: #a0eaff;
    box-shadow: 0 0 10px #00ccff inset;
    font-size: 1em;
  }

  textarea {
    resize: vertical;
  }

  button[type="submit"] {
    background-color: #00ccff;
    border: none;
    color: #121224;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1.1em;
    box-shadow: 0 0 15px #00ccff;
    transition: background-color 0.3s ease;
  }

  button[type="submit"]:hover {
    background-color: #66f0ff;
    box-shadow: 0 0 25px #66f0ff;
  }
</style>

<h1>Новий пост</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Створити</button>
</form>

{% endblock %}
