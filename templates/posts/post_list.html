{% extends 'base/base.html' %}
{% block content %}
<h1>Пости</h1>
<a href="{% url 'posts:post_create' %}">➕ Новий пост</a>
<ul>
    {% for post in posts %}
        <li>
            <a href="{% url 'posts:post_detail' post.pk %}">{{ post.title }}</a> — {{ post.creator }}
            {% if post.creator == request.user %}
                <a href="{% url 'posts:post_update' post.pk %}">✏️</a>
                <a href="{% url 'posts:post_delete' post.pk %}">🗑️</a>
            {% endif %}
        </li>
    {% empty %}
        <li>Постів немає.</li>
    {% endfor %}
</ul>
{% endblock %}
