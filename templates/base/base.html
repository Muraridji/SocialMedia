<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій сайт{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

<nav>
    <a href="{% url 'home' %}">🏠 Головна</a>

    {% if request.user.is_authenticated %}
        <a href="{% url 'accounts:user-profile' request.user.username %}">👤 Профіль</a>
        <a href="{% url 'accounts:friends_list' request.user.username %}">👥 Друзі</a>
    {% else %}
        <a href="{% url 'accounts:login' %}">Увійти</a>
    {% endif %}

    <a href="{% url 'accounts:user_list' %}">🔍 Користувачі</a>
    <a href="{% url 'accounts:friend_request' %}">📨 Запити</a>
    <a href="{% url 'chat:chat_list' %}">💬 Чати</a>
</nav>
<hr>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
