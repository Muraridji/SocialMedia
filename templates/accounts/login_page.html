{% extends "base/base.html" %}

{% block content %}
<style>
  .form-wrapper {
    background-color: #121224; /* ещё темнее, чем регистрация */
    padding: 32px;
    border-radius: 14px;
    box-shadow:
      0 0 8px #00ccff,  /* лёгкий неоновый голубой свет */
      0 0 15px #00ccff55;
    color: #e0f7ff;
  }

  h2 {
    color: #00e5ff;
    font-weight: 700;
    text-align: center;
    margin-bottom: 28px;
    text-shadow: 0 0 8px #00e5ffaa;
  }

  /* Кнопка */
  .btn-login {
    width: 100%;
    background: linear-gradient(45deg, #00ccff, #0099cc);
    border: none;
    color: #fff;
    font-weight: 700;
    padding: 14px;
    border-radius: 10px;
    box-shadow: 0 0 10px #00ccff88;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .btn-login:hover {
    background: linear-gradient(45deg, #0099cc, #006699);
    box-shadow: 0 0 20px #00ccffdd;
  }

  /* Поля ввода */
  input, select, textarea {
    background-color: #0d1220;
    border: 2px solid #00ccff;
    color: #a0f0ff;
    padding: 12px 14px;
    border-radius: 8px;
    width: 100%;
    margin-bottom: 18px;
    font-weight: 600;
    font-size: 1rem;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    box-shadow: inset 0 0 5px #00ccff44;
  }
  input::placeholder {
    color: #66cceeaa;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 12px #00e5ffaa;
    outline: none;
    background-color: #10172d;
  }

  /* Подсказки и ошибки */
  .form-text {
    color: #66d9ff;
    font-size: 0.875rem;
    text-shadow: 0 0 6px #00ccff99;
  }

  /* Текст под формой */
  .login-text, .login-text a {
    color: #a0eaff;
    font-weight: 600;
    text-align: center;
    display: block;
    margin-top: 18px;
    transition: color 0.3s ease;
  }
  .login-text a:hover {
    color: #00ccff;
    text-decoration: underline;
  }
</style>

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="form-wrapper">
      <h2>Вхід</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-login">Увійти</button>
      </form>
      <p class="login-text">
        Немає акаунту? <a href="{% url 'accounts:signup' %}">Зареєструватися</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
