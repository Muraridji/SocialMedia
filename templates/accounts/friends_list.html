{% extends 'base/base.html' %}

{% block content %}
<style>
  body {
    background-color: #121224;
    color: #a0eaff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  h1 {
    text-align: center;
    margin: 30px 0 20px 0;
    font-weight: 700;
    font-size: 2rem;
    color: #00ccff;
    text-shadow: 0 0 8px #00e5ffbb;
  }

  .search-form {
    max-width: 500px;
    margin: 0 auto 30px auto;
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .search-form input[type="text"] {
    padding: 10px;
    border: 2px solid #00ccff;
    border-radius: 8px;
    background-color: #10172d;
    color: #a0eaff;
    width: 100%;
  }

  .search-form button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background-color: #00ccff;
    color: #121224;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .search-form button:hover {
    background-color: #00e5ff;
  }

  ul.friends-list {
    max-width: 700px;
    margin: 0 auto;
    padding: 0;
    list-style: none;
  }

  ul.friends-list li {
    background-color: #10172d;
    border-radius: 14px;
    padding: 16px 24px;
    margin-bottom: 16px;
    box-shadow: 0 0 8px #00ccff55;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #00ccff;
  }

  .username {
    font-size: 1.1rem;
    font-weight: 600;
    color: #a0eaff;
  }

  .empty-message {
    text-align: center;
    font-style: italic;
    color: #888;
    margin-top: 20px;
  }
</style>

<h1>Друзі</h1>

<div style="text-align: center; margin-bottom: 30px;">
  <a href="{% url 'accounts:user_list' %}" style="padding: 10px 20px; background-color: #00ccff; color: #121224; border-radius: 10px; font-weight: bold; text-decoration: none; box-shadow: 0 0 10px #00ccffaa;">👥 Знайти друзів</a>
</div>

<form method="get" class="search-form">
  <input type="text" name="search" placeholder="Пошук друга за ніком" value="{{ request.GET.search }}">
  <button type="submit">🔍 Пошук</button>
</form>

<ul class="friends-list">
  {% for friend in friends %}
    <li>
      {% if friend.profile.avatar %}
        <img src="{{ friend.profile.avatar.url }}" alt="Аватар {{ friend.username }}" class="avatar">
      {% endif %}
      <span class="username">{{ friend.username }}</span>
    </li>
  {% empty %}
    <li class="empty-message">Друзів не знайдено</li>
  {% endfor %}
</ul>
{% endblock %}
